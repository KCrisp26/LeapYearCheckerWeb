name: Publish leap year checker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set website path
        run: |
          sed -i 's|<base href="/"|<base href="/LeapYearCheckerWeb/"|' wwwroot/index.html

      - name: Build website
        run: dotnet publish LeapYearCheckerWeb.csproj -c Release -o published

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: published/wwwroot

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4